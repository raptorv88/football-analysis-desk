<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0f26"/>
      <stop offset="50%" stop-color="#12081c"/>
      <stop offset="100%" stop-color="#09040e"/>
    </linearGradient>

    <!-- Neon Rim Border -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a9d"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <!-- Bar 1 Gradient (Cyan) -->
    <linearGradient id="bar1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="100%" stop-color="#11998e"/>
    </linearGradient>

    <!-- Bar 2 Gradient (Violet) -->
    <linearGradient id="bar2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Bar 3 Gradient (Vibrant Pink - primary brand) -->
    <linearGradient id="bar3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4bb8"/>
      <stop offset="100%" stop-color="#e52e9f"/>
    </linearGradient>

    <!-- Trend Line Gradient -->
    <linearGradient id="trendGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#00f2fe" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle App Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#rimGrad)" stroke-width="2" stroke-opacity="0.85"/>

  <!-- Analytics Chart Base Grid Line -->
  <line x1="10" y1="52" x2="54" y2="52" stroke="#352445" stroke-width="2" stroke-linecap="round"/>

  <!-- Analytics Metric Bars -->
  <!-- Bar 1 (Left / Green-Cyan) -->
  <rect x="12" y="34" width="9" height="18" rx="3.5" fill="url(#bar1Grad)"/>

  <!-- Bar 2 (Middle / Violet) -->
  <rect x="25" y="24" width="9" height="28" rx="3.5" fill="url(#bar2Grad)"/>

  <!-- Bar 3 (Right / Hot Pink) -->
  <rect x="38" y="14" width="9" height="38" rx="3.5" fill="url(#bar3Grad)"/>

  <!-- Upward Predictive Trend Line -->
  <polyline points="16.5,34 29.5,24 42.5,14 53,8" 
            fill="none" 
            stroke="url(#trendGrad)" 
            stroke-width="2.6" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            filter="url(#glow)"/>

  <!-- Data Point Nodes (Dots on the peaks) -->
  <circle cx="16.5" cy="34" r="2.2" fill="#ffffff" stroke="#11998e" stroke-width="1.2"/>
  <circle cx="29.5" cy="24" r="2.2" fill="#ffffff" stroke="#7e22ce" stroke-width="1.2"/>
  <circle cx="42.5" cy="14" r="2.2" fill="#ffffff" stroke="#e52e9f" stroke-width="1.2"/>

  <!-- Peak Indicator Spark Node (Future prediction forecast) -->
  <circle cx="53" cy="8" r="3.2" fill="#00f2fe" stroke="#ffffff" stroke-width="1.4"/>
</svg>
